name: Build & Deploy
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache-dependency-path: src/package-lock.json
          cache: "npm"

      - name: Install dependencies
        run: npm --prefix src ci
      - name: ESLint
        run: npm --prefix src run lint
      - name: Docusaurus Build
        run: npm --prefix src run build
      # The build cannot catch a malformed diagram - mermaid renders in the
      # reader's browser - so gate the deploy on it explicitly. It runs after the
      # build rather than before because the build's own sync-references step
      # populates the generated reference pages this check needs to see; a
      # separate sync step here cloned avocado-linux/references a second time for
      # nothing. Ordering does not weaken the gate: deploy needs this whole job.
      - name: Mermaid Diagrams
        run: npm --prefix src run check-mermaid

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
